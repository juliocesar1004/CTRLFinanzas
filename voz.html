<script>
(function(){'use strict';
const VOICE_ORIGIN='https://juliocesar1004.github.io';
const VOICE_URL=VOICE_ORIGIN+'/CTRLFinanzas/voz.html';
let voicePopup=null,voiceSession=null,voiceTimeout=null;
function voiceId(){if(window.crypto&&crypto.getRandomValues){const bytes=new Uint32Array(4);crypto.getRandomValues(bytes);return Array.from(bytes,x=>x.toString(16)).join('')}return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function voiceUi(active,label){const mic=document.querySelector('[data-voz]'),text=document.querySelector('#listen');if(mic){mic.classList.toggle('listening',active);mic.setAttribute('aria-pressed',active?'true':'false')}if(text)text.textContent=label||'Toque para hablar'}
function voiceNotice(message,error){const toast=document.querySelector('#toast');if(!toast)return;toast.textContent=message;toast.style.background=error?'#8f1730':'#17324d';toast.classList.add('show');window.setTimeout(()=>toast.classList.remove('show'),4200)}
function closeVoicePopup(){window.clearTimeout(voiceTimeout);voiceTimeout=null;if(voicePopup&&!voicePopup.closed)voicePopup.close();voicePopup=null;voiceSession=null;voiceUi(false)}
function voiceFailure(code,technical){const messages={popup_blocked:'El navegador bloqueó la ventana del micrófono. Permita ventanas emergentes para CTRLFinanzas.',unsupported:'Este navegador no admite reconocimiento de voz. Use Google Chrome o Microsoft Edge.',no_speech:'No se detectó voz. Pulse el micrófono e intente nuevamente.',timeout:'Se agotó el tiempo de escucha. Pulse el micrófono para volver a intentarlo.',not_allowed:'El permiso del micrófono fue denegado. Permítalo en la ventana de voz y vuelva a intentar.',service_not_allowed:'El servicio de reconocimiento de voz no está permitido en este navegador.',audio_capture:'No se encontró un micrófono disponible.',network:'No fue posible procesar la voz. Revise su conexión.',aborted:'La escucha fue cancelada.'};console.error('Error técnico del puente de voz:',{code,technical});closeVoicePopup();voiceNotice(messages[code]||'No fue posible usar el micrófono.',true)}
function openVoicePopup(){if(voiceSession)return;const token=voiceId(),requestId='VOICE-'+voiceId();voiceSession={token,requestId};const width=420,height=560,left=Math.max(0,Math.round((screen.width-width)/2)),top=Math.max(0,Math.round((screen.height-height)/2));voicePopup=window.open(VOICE_URL+'#token='+encodeURIComponent(token),'CTRLFinanzasVoz',`popup=yes,width=${width},height=${height},left=${left},top=${top}`);if(!voicePopup){voiceSession=null;voiceFailure('popup_blocked','window.open devolvió null');return}voiceUi(true,'Abriendo micrófono…');voiceTimeout=window.setTimeout(()=>voiceFailure('timeout','La ventana de voz no respondió en 20 segundos'),20000)}
document.addEventListener('click',event=>{const button=event.target.closest('[data-voz]');if(!button)return;event.preventDefault();event.stopPropagation();openVoicePopup()});
window.addEventListener('message',event=>{const data=event.data||{};if(event.origin!==VOICE_ORIGIN||!voicePopup||event.source!==voicePopup||!voiceSession||data.source!=='CTRLFINANZAS_VOICE'||data.token!==voiceSession.token){if(data&&data.source==='CTRLFINANZAS_VOICE')console.warn('Mensaje de voz ignorado por origen, ventana o token inválido.',{origin:event.origin,type:data.type});return}if(data.type==='ready'){voicePopup.postMessage({source:'CTRLFINANZAS_APP',type:'start',token:voiceSession.token},VOICE_ORIGIN);voiceUi(true,'Escuchando…');return}if(data.type==='listening'){voiceUi(true,'Escuchando…');return}if(data.type==='result'){const text=String(data.text||'').trim(),requestId=voiceSession.requestId;if(!text){voiceFailure('no_speech','El puente devolvió una transcripción vacía');return}closeVoicePopup();const transcript=document.querySelector('#transcript');if(transcript)transcript.textContent=text;document.dispatchEvent(new CustomEvent('ctrlfinanzas:voice-result',{detail:{text,requestId}}));return}if(data.type==='error')voiceFailure(String(data.code||'unknown').replace(/-/g,'_'),data.technical||data)});
})();
</script>
