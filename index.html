tus.classList.remove('show'),3500)}if(!SR){mic.disabled=true;say('Use Google Chrome o Microsoft Edge',true)}else{const r=new SR();r.lang='es-CO';r.continuous=false;r.interimResults=false;r.onstart=()=>{mic.classList.add('on');mic.setAttribute('aria-pressed','true');say('Escuchando…')};r.onend=()=>{mic.classList.remove('on');mic.setAttribute('aria-pressed','false')};r.onerror=e=>say(e.error==='not-allowed'?'Permita el micrófono para este sitio':'No fue posible reconocer la voz',true);r.onresult=e=>{const text=e.results[0][0].transcript;say('Reconocido: '+text);frame.contentWindow.postMessage({source:'CTRLFINANZAS_VOICE',type:'transcript',text},'*')};mic.onclick=()=>{try{r.start()}catch(e){r.stop()}}}</script></body></html>
