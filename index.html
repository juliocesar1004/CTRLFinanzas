<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CTRLFinanzas Voz</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef4fa;font:16px system-ui;color:#17324d}.mic{position:fixed;z-index:10;top:312px;left:50%;transform:translateX(-50%);display:grid;place-items:center;width:104px;height:104px;border:0;border-radius:50%;background:linear-gradient(145deg,#1457d9,#0e8da1);color:white;font-size:42px;cursor:pointer;box-shadow:0 8px 28px #1457d944}.mic.on{background:#bb2845;animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}#status{position:fixed;z-index:11;top:270px;left:50%;transform:translateX(-50%);background:#17324d;color:white;padding:8px 14px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}#status.show{opacity:1}iframe{display:block;border:0;width:100%;height:100vh;background:white}@media(max-width:600px){.mic{top:185px}#status{top:150px}}
  </style>
</head>
<body>
  <button id="mic" class="mic" aria-label="Hablar" aria-pressed="false">🎙️</button>
  <div id="status" role="status" aria-live="polite"></div>
  <iframe id="app" title="Aplicación CTRLFinanzas" src="https://script.google.com/macros/s/AKfycbyw-WpulPPihc5GaNjpJxGmDtRxw2pQg4SKvaNMvo3IKXT694c2ZZ-OxxU5pLRGRQLb7A/exec?externalVoice=1" allow="clipboard-write"></iframe>
  <elevenlabs-convai agent-id="agent_8501kx4nahsbf21a3gkgcvdk29f1"></elevenlabs-convai>
  <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async></script>
  <script>
    const APP_URL='https://script.google.com/macros/s/AKfycbyw-WpulPPihc5GaNjpJxGmDtRxw2pQg4SKvaNMvo3IKXT694c2ZZ-OxxU5pLRGRQLb7A/exec';
    const mic=document.querySelector('#mic'),status=document.querySelector('#status'),frame=document.querySelector('#app');
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    function say(text,bad){status.textContent=text;status.style.background=bad?'#8f1730':'#17324d';status.classList.add('show');setTimeout(()=>status.classList.remove('show'),3500)}
    if(!SR){mic.disabled=true;say('Use Google Chrome o Microsoft Edge',true)}else{
      const recognition=new SR();recognition.lang='es-CO';recognition.continuous=false;recognition.interimResults=false;
      recognition.onstart=()=>{mic.classList.add('on');mic.setAttribute('aria-pressed','true');say('Escuchando…')};
      recognition.onend=()=>{mic.classList.remove('on');mic.setAttribute('aria-pressed','false')};
      recognition.onerror=e=>say(e.error==='not-allowed'?'Permita el micrófono para este sitio':'No fue posible reconocer la voz',true);
      recognition.onresult=e=>{const text=e.results[0][0].transcript;say('Procesando: '+text);frame.src=APP_URL+'?externalVoice=1&voice='+encodeURIComponent(text)+'&t='+Date.now()};
      mic.onclick=()=>{try{recognition.start()}catch(e){recognition.stop()}};
    }
  </script>
</body>
</html>
